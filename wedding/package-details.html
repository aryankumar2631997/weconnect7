<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Wedding Package Details | WeConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .detail-container { min-height: 100vh; padding: 100px 20px 60px; background: var(--bg-secondary); }
    .detail-wrapper { max-width: 1000px; margin: 0 auto; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-light); text-decoration: none; margin-bottom: 24px; }
    .back-link:hover { color: var(--text); }
    .package-card { background: var(--bg); border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--border); }
    .package-header { padding: 28px; border-bottom: 1px solid var(--border); text-align: center; background: linear-gradient(135deg, rgba(139,92,246,0.05), rgba(59,130,246,0.05)); }
    .package-icon { font-size: 64px; margin-bottom: 16px; }
    .package-name { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    .package-price { font-size: 36px; font-weight: 800; color: var(--blue); margin: 16px 0; }
    .package-price small { font-size: 14px; font-weight: normal; color: var(--text-muted); }
    .section { padding: 24px 28px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .inclusions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .inclusion-item { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 14px; display: flex; align-items: center; gap: 12px; }
    .inclusion-icon { width: 32px; height: 32px; background: rgba(16,185,129,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--confirmed); }
    .inclusion-text { font-size: 14px; font-weight: 500; }
    .features-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
    .feature-tag { padding: 8px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 30px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .specs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .spec-item { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 14px; text-align: center; }
    .spec-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .spec-value { font-size: 18px; font-weight: 700; }
    .vendors-list { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
    .vendor-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--bg-secondary); border-radius: var(--radius-lg); flex-wrap: wrap; gap: 16px; }
    .vendor-name { font-weight: 700; font-size: 16px; }
    .vendor-type { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .btn-book { padding: 10px 28px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-book:hover { background: #333; transform: translateY(-2px); }
    .btn-enquire { width: 100%; padding: 14px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: all 0.2s; }
    .btn-enquire:hover { background: #333; transform: translateY(-2px); }
    .emi-note { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    @media (max-width: 768px) { .inclusions-grid { grid-template-columns: 1fr; } .specs-grid { grid-template-columns: repeat(2, 1fr); } .vendor-item { flex-direction: column; text-align: center; } }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="logo"><div class="logo-icon">🔗</div><div class="logo-text">We<span>Connect</span></div></a>
    <ul class="nav-links"><li><a href="/index.html">Home</a></li><li><a href="/user/my-orders.html" id="my-orders-link" style="display:none">My Orders</a></li></ul>
    <div class="nav-buttons"><span id="user-name" style="display:none;"></span><button class="btn btn-outline" id="login-nav-btn" onclick="window.location.href='/user/login.html'">Login</button><button class="btn btn-primary" id="logout-nav-btn" style="display:none" onclick="logout()">Logout</button></div>
    <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu"><a href="/index.html">Home</a><a href="/user/my-orders.html" id="mobile-my-orders" style="display:none">My Orders</a><a href="/user/login.html" id="mobile-login">Login</a><a href="#" id="mobile-logout" style="display:none" onclick="logout()">Logout</a></div>

<div class="detail-container">
  <div class="detail-wrapper">
    <a href="/wedding/index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Wedding Services</a>
    <div id="packageContent"><div style="text-align:center;padding:60px;"><i class="fas fa-spinner fa-spin"></i> Loading package details...</div></div>
  </div>
</div>

<footer><div class="container"><div class="footer-content"><div class="footer-logo">WeConnect</div><div class="footer-text">© 2025 WeConnect — Lakhisarai, Bihar</div></div></div></footer>

<script src="/js/app.js"></script>


<script>
  const packagesDB = {
    "complete": {
      name: "Complete Wedding Package",
      price: "Custom Quote",
      startingPrice: 250000,
      duration: "2-3 days",
      guests: "200-500",
      about: "The Complete Wedding Package is designed to take all stress away from your special day. We handle everything from venue selection to send-off, ensuring a seamless and memorable wedding experience.",
      inclusions: [
        { icon: "🏰", text: "Venue Booking (Banquet Hall/Lawn)" },
        { icon: "🍽️", text: "Catering Services (Veg/Non-Veg)" },
        { icon: "📸", text: "Professional Photography & Videography" },
        { icon: "🎨", text: "Wedding Decoration (Theme based)" },
        { icon: "🎵", text: "DJ & Sound System" },
        { icon: "🚗", text: "Transport for Bride & Groom" },
        { icon: "💄", text: "Makeup Artist for Bride" },
        { icon: "👔", text: "Groom's Sherwani on Rent" },
        { icon: "📜", text: "Invitation Card Design & Printing" },
        { icon: "🎁", text: "Wedding Favors for Guests" },
        { icon: "🛏️", text: "Accommodation for 20 Guests" },
        { icon: "🚑", text: "Medical Assistance on Site" }
      ],
      features: ["Customizable Theme", "Premium Decoration", "LIVE Food Counters", "Welcome Drinks", "DJ with MC", "Photo Booth", "Fireworks Display"],
      vendors: [
        { name: "Maharaja Grand", type: "Venue", rating: 4.8 },
        { name: "Royal Catering", type: "Catering", rating: 4.7 },
        { name: "Memories Photography", type: "Photography", rating: 4.9 },
        { name: "Floral Dreams Decor", type: "Decoration", rating: 4.7 },
        { name: "DJ Sound Factory", type: "DJ", rating: 4.8 }
      ]
    },
    "premium": {
      name: "Premium Wedding Package",
      price: "₹5,00,000 - ₹10,00,000",
      startingPrice: 500000,
      duration: "3 days",
      guests: "500-1000",
      about: "The Premium Wedding Package offers luxury wedding experience with premium vendors and exclusive services.",
      inclusions: [
        { icon: "🏰", text: "Premium Venue (5 Star)" },
        { icon: "🍽️", text: "Premium Catering (Multi-cuisine)" },
        { icon: "📸", text: "Candid Photography + Cinematic Video" },
        { icon: "🎨", text: "Luxury Decoration with Fresh Flowers" },
        { icon: "🎵", text: "Live Band + DJ" },
        { icon: "🚗", text: "Luxury Car for Baraat" },
        { icon: "💄", text: "Bridal Makeup + Hair Styling" }
      ],
      features: ["Live Band", "Fireworks", "Photo Booth", "Welcome Drinks", "VIP Lounge"],
      vendors: []
    },
    "basic": {
      name: "Basic Wedding Package",
      price: "₹1,00,000 - ₹2,50,000",
      startingPrice: 100000,
      duration: "1 day",
      guests: "100-200",
      about: "The Basic Wedding Package covers all essential services for a simple yet beautiful wedding ceremony.",
      inclusions: [
        { icon: "🏰", text: "Venue Booking" },
        { icon: "🍽️", text: "Catering (Basic Menu)" },
        { icon: "📸", text: "Standard Photography" },
        { icon: "🎨", text: "Basic Decoration" },
        { icon: "🎵", text: "DJ System" }
      ],
      features: ["Basic Decoration", "Standard Menu", "DJ Setup"],
      vendors: []
    }
  };

  function getQueryParam(param) { return new URLSearchParams(window.location.search).get(param); }

  function loadPackage() {
    const type = getQueryParam('type');
    if (!type || !packagesDB[type]) { errorPage(); return; }
    
    const pkg = packagesDB[type];
    
    const inclusionsHtml = pkg.inclusions.map(inc => `
      <div class="inclusion-item">
        <div class="inclusion-icon"><span style="font-size: 18px;">${inc.icon}</span></div>
        <div class="inclusion-text">${inc.text}</div>
      </div>
    `).join('');
    
    const featuresHtml = pkg.features.map(f => `<span class="feature-tag">✨ ${f}</span>`).join('');
    
    const vendorsHtml = pkg.vendors.map(v => `
      <div class="vendor-item">
        <div>
          <div class="vendor-name">${v.name}</div>
          <div class="vendor-type">${v.type} • ⭐ ${v.rating}</div>
        </div>
        <button class="btn-book" onclick="bookVendor('${v.type.toLowerCase()}', '${v.name}')">View Details →</button>
      </div>
    `).join('');
    
    const html = `
      <div class="package-card">
        <div class="package-header">
          <div class="package-icon">💍✨</div>
          <div class="package-name">${pkg.name}</div>
          <div class="package-price">${pkg.price}<small> (starting price)</small></div>
          <div style="display: flex; gap: 40px; justify-content: center; margin-top: 16px; flex-wrap: wrap;">
            <div><i class="fas fa-users"></i> 👥 Up to ${pkg.guests} guests</div>
            <div><i class="fas fa-calendar"></i> 📅 ${pkg.duration} event</div>
            <div><i class="fas fa-rupee-sign"></i> 💰 EMI Available</div>
          </div>
        </div>
        
        <div class="section"><div class="section-title"><i class="fas fa-info-circle"></i> Package Details</div><p style="color: var(--text-light); line-height: 1.6;">${pkg.about}</p></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-check-circle"></i> What's Included</div><div class="inclusions-grid">${inclusionsHtml}</div></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-star"></i> Premium Features</div><div class="features-list">${featuresHtml}</div></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-building"></i> Our Trusted Vendors</div><div class="vendors-list">${vendorsHtml || '<p style="color: var(--text-muted);">Vendors will be assigned based on availability and your preferences.</p>'}</div></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-chart-line"></i> Package Highlights</div><div class="specs-grid"><div class="spec-item"><div class="spec-label">Booking Amount</div><div class="spec-value">50% Advance</div></div><div class="spec-item"><div class="spec-label">Planning Time</div><div class="spec-value">2-4 weeks</div></div><div class="spec-item"><div class="spec-label">Customization</div><div class="spec-value">Fully Customizable</div></div><div class="spec-item"><div class="spec-label">Payment Plans</div><div class="spec-value">EMI Available</div></div></div></div>
        
        <div style="padding: 24px 28px;">
          <button class="btn-enquire" onclick="enquirePackage('${type}', '${pkg.name}')">💍 Book This Wedding Package →</button>
          <div class="emi-note">✨ EMI options available. Customizations possible as per your budget and preferences.</div>
        </div>
      </div>
    `;
    
    document.getElementById('packageContent').innerHTML = html;
  }
  
  function bookVendor(type, name) {
    const user = WeConnectAuth.getCurrentUser();
    if (!user) { WeConnect.showToast('Please login to book', 'warning'); setTimeout(() => window.location.href = '/user/login.html', 1000); return; }
    sessionStorage.setItem('booking_temp', JSON.stringify({ type: 'wedding', serviceType: type, vendorName: name }));
    window.location.href = `/wedding/booking.html?type=${type}&name=${encodeURIComponent(name)}`;
  }
  
  function enquirePackage(type, name) {
    const user = WeConnectAuth.getCurrentUser();
    if (!user) { WeConnect.showToast('Please login to enquire', 'warning'); setTimeout(() => window.location.href = '/user/login.html', 1000); return; }
    sessionStorage.setItem('booking_temp', JSON.stringify({ type: 'wedding', serviceType: 'complete-package', packageName: name }));
    window.location.href = `/wedding/booking.html?type=complete-package&name=${encodeURIComponent(name)}`;
  }
  
  function errorPage() { document.getElementById('packageContent').innerHTML = `<div class="package-card"><div style="text-align:center;padding:60px;"><i class="fas fa-exclamation-triangle" style="font-size:48px;color:var(--rejected);"></i><h3>Package Not Found</h3><a href="/wedding/index.html" class="btn btn-primary">Back to Wedding Services</a></div></div>`; }
  
  function updateUI() { const u = WeConnectAuth.getCurrentUser(); if (u) { document.getElementById('login-nav-btn').style.display = 'none'; document.getElementById('logout-nav-btn').style.display = 'inline-flex'; document.getElementById('user-name').style.display = 'inline-block'; document.getElementById('user-name').textContent = u.name || u.phone; document.getElementById('my-orders-link').style.display = 'inline-block'; } }
  
  window.logout = function() { sessionStorage.removeItem('weconnect_current_user'); window.location.href = '/index.html'; };
  window.bookVendor = bookVendor;
  window.enquirePackage = enquirePackage;
  updateUI();
  loadPackage();
</script>
  <script src="/js/theme-lang.js"></script>`n</body>
</html>
