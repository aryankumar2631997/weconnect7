<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Book Local Service | WeConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .booking-container { min-height: 100vh; padding: 100px 20px 60px; background: var(--bg-secondary); }
    .booking-wrapper { max-width: 650px; margin: 0 auto; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-light); text-decoration: none; margin-bottom: 24px; }
    .back-link:hover { color: var(--text); }
    .booking-card { background: var(--bg); border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--border); }
    .service-header { padding: 24px; border-bottom: 1px solid var(--border); background: linear-gradient(135deg, var(--bg-secondary), var(--bg)); display: flex; gap: 20px; flex-wrap: wrap; }
    .service-icon-box { width: 60px; height: 60px; background: var(--bg); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .service-info { flex: 1; }
    .service-name-head { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .service-meta { font-size: 13px; color: var(--text-muted); }
    .booking-summary { padding: 20px 24px; background: var(--bg-secondary); }
    .summary-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .summary-label { font-weight: 600; }
    .summary-value { font-weight: 700; color: var(--blue); }
    .estimate-box { background: rgba(59,130,246,0.08); border-radius: var(--radius-md); padding: 12px; margin-top: 16px; text-align: center; font-size: 13px; color: var(--blue); }
    .form-section { padding: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 14px; background: var(--bg); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn-confirm { width: 100%; padding: 14px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 16px; }
    .btn-confirm:hover { background: #333; transform: translateY(-2px); }
    @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } .service-header { flex-direction: column; text-align: center; } }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="logo"><div class="logo-icon">🔗</div><div class="logo-text">We<span>Connect</span></div></a>
    <ul class="nav-links"><li><a href="/index.html">Home</a></li><li><a href="/user/my-orders.html" id="my-orders-link" style="display:none">My Orders</a></li></ul>
    <div class="nav-buttons"><span id="user-name" style="display:none;"></span><button class="btn btn-outline" id="login-nav-btn" onclick="window.location.href='/user/login.html'">Login</button><button class="btn btn-primary" id="logout-nav-btn" style="display:none" onclick="logout()">Logout</button></div>
    <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu"><a href="/index.html">Home</a><a href="/user/my-orders.html" id="mobile-my-orders" style="display:none">My Orders</a><a href="/user/login.html" id="mobile-login">Login</a><a href="#" id="mobile-logout" style="display:none" onclick="logout()">Logout</a></div>

<div class="booking-container">
  <div class="booking-wrapper">
    <a href="/local-services/index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Local Services</a>
    <div id="bookingContent"><div style="text-align:center;padding:60px;"><i class="fas fa-spinner fa-spin"></i> Loading booking details...</div></div>
  </div>
</div>

<footer><div class="container"><div class="footer-content"><div class="footer-logo">WeConnect</div><div class="footer-text">© 2025 WeConnect — Lakhisarai, Bihar</div></div></div></footer>

<script src="/js/app.js"></script>

<script>
  function getQueryParam(param) { return new URLSearchParams(window.location.search).get(param); }

  function loadBooking() {
    // First try to get from sessionStorage
    const tempData = sessionStorage.getItem('booking_temp');
    let bookingInfo = null;
    
    if (tempData) {
      bookingInfo = JSON.parse(tempData);
    } else {
      const type = getQueryParam('type');
      const provider = getQueryParam('provider');
      const name = getQueryParam('name');
      if (type) {
        bookingInfo = { 
          type: 'local-service', 
          serviceType: type, 
          providerName: provider || name || type,
          price: 'Contact for quote'
        };
      }
    }
    
    if (!bookingInfo) {
      errorPage();
      return;
    }
    
    const serviceIcons = { 
      electrician: '⚡', 
      plumber: '🔧', 
      carpenter: '🪚', 
      cleaner: '🧹', 
      'ac-repair': '❄️', 
      'mobile-repair': '📱', 
      painter: '🎨', 
      driver: '🚗' 
    };
    const icon = serviceIcons[bookingInfo.serviceType] || '🔧';
    
    const serviceLabels = {
      electrician: 'Electrician Service',
      plumber: 'Plumber Service',
      carpenter: 'Carpenter Service',
      cleaner: 'Cleaning Service',
      'ac-repair': 'AC Repair Service',
      'mobile-repair': 'Mobile Repair Service',
      painter: 'Painting Service',
      driver: 'Driver Service'
    };
    
    const html = `
      <div class="booking-card">
        <div class="service-header">
          <div class="service-icon-box">${icon}</div>
          <div class="service-info">
            <div class="service-name-head">${bookingInfo.providerName || bookingInfo.serviceType}</div>
            <div class="service-meta">${serviceLabels[bookingInfo.serviceType] || 'Local Service'} • On-site Service</div>
          </div>
        </div>
        
        <div class="booking-summary">
          <div class="summary-row"><span class="summary-label">Service Provider</span><span class="summary-value">${bookingInfo.providerName || bookingInfo.serviceType}</span></div>
          <div class="summary-row"><span class="summary-label">Service Type</span><span class="summary-value">${serviceLabels[bookingInfo.serviceType] || bookingInfo.serviceType}</span></div>
          <div class="summary-row"><span class="summary-label">Estimated Price</span><span class="summary-value">${bookingInfo.price || 'Contact for quote'}</span></div>
          <div class="estimate-box">
            💰 Estimated charges: ${bookingInfo.price || 'Contact for quote'}<br>
            ⚡ Final price may vary based on work scope
          </div>
        </div>
        
        <div class="form-section">
          <form id="bookingForm">
            <div class="form-row">
              <div class="form-group"><label>Your Full Name *</label><input type="text" id="fullName" required></div>
              <div class="form-group"><label>WhatsApp Number *</label><input type="tel" id="phone" required></div>
            </div>
            <div class="form-group"><label>Service Address *</label><input type="text" id="address" required placeholder="Your complete address"></div>
            <div class="form-row">
              <div class="form-group"><label>Preferred Date *</label><input type="date" id="serviceDate" required></div>
              <div class="form-group"><label>Preferred Time *</label><select id="serviceTime" required>
                <option value="">Select time</option>
                <option>9:00 AM - 11:00 AM</option>
                <option>11:00 AM - 1:00 PM</option>
                <option>1:00 PM - 3:00 PM</option>
                <option>3:00 PM - 5:00 PM</option>
                <option>5:00 PM - 7:00 PM</option>
              </select></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Urgency *</label><select id="urgency">
                <option>Normal (2-3 days)</option>
                <option>Urgent (within 24 hours, +₹100)</option>
                <option>Emergency (ASAP, +₹200)</option>
              </select></div>
              <div class="form-group"><label>Estimated Budget (₹)</label><input type="number" id="budget" placeholder="Optional"></div>
            </div>
            <div class="form-group"><label>Describe Your Requirement *</label><textarea id="description" rows="3" required placeholder="Please describe the work needed in detail..."></textarea></div>
            <div class="form-group"><label>Upload Photo (optional)</label><input type="file" id="photo" accept="image/*"></div>
            <button type="submit" class="btn-confirm">✅ Book Service</button>
          </form>
        </div>
      </div>
    `;
    
    document.getElementById('bookingContent').innerHTML = html;
    
    const today = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById('serviceDate');
    if (dateInput) dateInput.min = today;
    
    const user = WeConnectAuth.getCurrentUser();
    if (user) {
      const nameInput = document.getElementById('fullName');
      const phoneInput = document.getElementById('phone');
      if (nameInput) nameInput.value = user.name || '';
      if (phoneInput) phoneInput.value = user.phone || '';
    }
    
    const form = document.getElementById('bookingForm');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        submitBooking(e, bookingInfo);
      });
    }
  }
  
  function submitBooking(e, bookingInfo) {
    const user = WeConnectAuth.getCurrentUser();
    if (!user) {
      WeConnect.showToast('Please login to book service', 'warning');
      setTimeout(() => window.location.href = '/user/login.html', 1000);
      return;
    }
    
    const name = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const serviceDate = document.getElementById('serviceDate').value;
    const serviceTime = document.getElementById('serviceTime').value;
    const urgency = document.getElementById('urgency').value;
    const budget = document.getElementById('budget').value;
    const description = document.getElementById('description').value.trim();
    
    if (!name || !phone || !address || !serviceDate || !serviceTime || !description) {
      WeConnect.showToast('Please fill all required fields', 'error');
      return;
    }
    
    const bookingId = 'LC-' + Date.now();
    const booking = {
      id: bookingId,
      userId: user.id,
      userPhone: user.phone,
      userName: user.name || name,
      serviceType: "Local Service",
      serviceName: bookingInfo.providerName || bookingInfo.serviceType,
      status: "pending",
      createdAt: new Date().toISOString(),
      formData: {
        provider: bookingInfo.providerName || bookingInfo.serviceType,
        serviceType: bookingInfo.serviceType,
        customerName: name,
        customerPhone: phone,
        address: address,
        serviceDate: serviceDate,
        serviceTime: serviceTime,
        urgency: urgency,
        budget: budget || 'Not specified',
        description: description
      }
    };
    
    let bookings = JSON.parse(localStorage.getItem('weconnect_bookings') || '[]');
    bookings.push(booking);
    localStorage.setItem('weconnect_bookings', JSON.stringify(bookings));
    
    sessionStorage.removeItem('booking_temp');
    WeConnect.showToast(`✅ Service booked! ID: ${bookingId}`, 'success');
    setTimeout(() => window.location.href = `/user/confirmation.html?id=${bookingId}`, 1500);
  }
  
  function errorPage() {
    document.getElementById('bookingContent').innerHTML = `
      <div class="booking-card">
        <div style="text-align:center;padding:60px;">
          <i class="fas fa-exclamation-triangle" style="font-size:48px;color:var(--rejected);"></i>
          <h3>Booking Error</h3>
          <p>No service selected. Please go back and try again.</p>
          <a href="/local-services/index.html" class="btn btn-primary" style="margin-top:20px;">Back to Services</a>
        </div>
      </div>
    `;
  }
  
  function updateUI() {
    const user = WeConnectAuth.getCurrentUser();
    if (user) {
      document.getElementById('login-nav-btn').style.display = 'none';
      document.getElementById('logout-nav-btn').style.display = 'inline-flex';
      document.getElementById('user-name').style.display = 'inline-block';
      document.getElementById('user-name').textContent = user.name || user.phone;
      document.getElementById('my-orders-link').style.display = 'inline-block';
      if (document.getElementById('mobile-my-orders')) document.getElementById('mobile-my-orders').style.display = 'block';
      if (document.getElementById('mobile-login')) document.getElementById('mobile-login').style.display = 'none';
      if (document.getElementById('mobile-logout')) document.getElementById('mobile-logout').style.display = 'block';
    }
  }
  
  window.logout = function() { 
    sessionStorage.removeItem('weconnect_current_user'); 
    window.location.href = '/index.html'; 
  };
  
  updateUI();
  loadBooking();
</script>
  <script src="/js/theme-lang.js"></script>`n</body>
</html>
