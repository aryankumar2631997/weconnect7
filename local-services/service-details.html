<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Service Details | WeConnect Local Services</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .detail-container { min-height: 100vh; padding: 100px 20px 60px; background: var(--bg-secondary); }
    .detail-wrapper { max-width: 900px; margin: 0 auto; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-light); text-decoration: none; margin-bottom: 24px; }
    .back-link:hover { color: var(--text); }
    .service-card { background: var(--bg); border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--border); }
    .service-header { padding: 28px; border-bottom: 1px solid var(--border); display: flex; gap: 24px; flex-wrap: wrap; }
    .service-icon-large { width: 80px; height: 80px; background: var(--bg-secondary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .service-info { flex: 1; }
    .service-name { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .service-category { font-size: 14px; color: var(--blue); margin-bottom: 12px; }
    .service-rating { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .stars { color: #F59E0B; font-size: 14px; }
    .contact-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-call { padding: 8px 20px; background: rgba(16,185,129,0.1); color: var(--confirmed); border: 1px solid rgba(16,185,129,0.3); border-radius: var(--radius-md); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-call:hover { background: var(--confirmed); color: white; }
    .section { padding: 24px 28px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
    .info-item { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 14px; text-align: center; }
    .info-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .info-value { font-size: 18px; font-weight: 700; }
    .price-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .price-item { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .price-name { font-weight: 600; }
    .price-amount { color: var(--blue); font-weight: 700; font-size: 18px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; background: rgba(16,185,129,0.1); color: var(--confirmed); }
    .reviews-list { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
    .review-item { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 16px; }
    .review-stars { color: #F59E0B; font-size: 12px; margin-bottom: 8px; }
    .review-text { font-size: 13px; color: var(--text-light); margin-bottom: 8px; }
    .review-author { font-size: 11px; color: var(--text-muted); }
    .btn-book { width: 100%; padding: 14px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: all 0.2s; }
    .btn-book:hover { background: #333; transform: translateY(-2px); }
    @media (max-width: 768px) { .info-grid { grid-template-columns: 1fr; } .service-header { flex-direction: column; text-align: center; } .contact-buttons { justify-content: center; } .price-item { flex-direction: column; text-align: center; } }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="logo"><div class="logo-icon">🔗</div><div class="logo-text">We<span>Connect</span></div></a>
    <ul class="nav-links"><li><a href="/index.html">Home</a></li><li><a href="/user/my-orders.html" id="my-orders-link" style="display:none">My Orders</a></li></ul>
    <div class="nav-buttons"><span id="user-name" style="display:none;"></span><button class="btn btn-outline" id="login-nav-btn" onclick="window.location.href='/user/login.html'">Login</button><button class="btn btn-primary" id="logout-nav-btn" style="display:none" onclick="logout()">Logout</button></div>
    <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu"><a href="/index.html">Home</a><a href="/user/my-orders.html" id="mobile-my-orders" style="display:none">My Orders</a><a href="/user/login.html" id="mobile-login">Login</a><a href="#" id="mobile-logout" style="display:none" onclick="logout()">Logout</a></div>

<div class="detail-container">
  <div class="detail-wrapper">
    <a href="/local-services/index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Local Services</a>
    <div id="serviceContent"><div style="text-align:center;padding:60px;"><i class="fas fa-spinner fa-spin"></i> Loading service details...</div></div>
  </div>
</div>

<footer><div class="container"><div class="footer-content"><div class="footer-logo">WeConnect</div><div class="footer-text">© 2025 WeConnect — Lakhisarai, Bihar</div></div></div></footer>

<script src="/js/app.js"></script>


<script>
  const servicesDB = {
    "electrician": {
      name: "Electrician Service", icon: "⚡", providers: 4,
      about: "Professional electrician services for all your electrical needs. From wiring to appliance repair, our electricians are experienced and certified.",
      pricing: [
        { service: "General Wiring", price: "₹500-1000" },
        { service: "Fan/ Light Installation", price: "₹200-400" },
        { service: "Switch/ Socket Repair", price: "₹150-300" },
        { service: "MCB/DB Fixing", price: "₹400-800" },
        { service: "Inverter/ UPS Service", price: "₹300-600" },
        { service: "Complete Home Wiring", price: "₹30-50/sqft" }
      ],
      features: ["24/7 Emergency Service", "Certified Electricians", "Free Inspection", "Quality Parts", "Service Warranty"],
      responseTime: "30-60 minutes",
      warranty: "30 days on workmanship",
      providersList: [
        { name: "Ramesh Electrician", rating: 4.9, experience: "12+ years" },
        { name: "Sunil Electricals", rating: 4.6, experience: "8+ years" },
        { name: "24/7 Emergency Electrician", rating: 4.8, experience: "10+ years" }
      ]
    },
    "plumber": {
      name: "Plumber Service", icon: "🔧", providers: 3,
      about: "Expert plumbers for all plumbing issues. Leakage, pipe installation, bathroom fitting, and more.",
      pricing: [
        { service: "Leakage Repair", price: "₹300-600" },
        { service: "Tap/ Faucet Installation", price: "₹150-300" },
        { service: "Pipe Fitting", price: "₹400-800" },
        { service: "Bathroom Renovation", price: "₹5000-15000" },
        { service: "Water Tank Cleaning", price: "₹800-1500" },
        { service: "Drain Blockage Removal", price: "₹300-500" }
      ],
      features: ["24/7 Emergency", "Experienced Plumbers", "Quality Spare Parts", "Same Day Service"],
      responseTime: "45-75 minutes",
      warranty: "15 days on workmanship",
      providersList: [
        { name: "Suresh Plumber", rating: 4.9, experience: "15+ years" },
        { name: "Raj Plumbing Works", rating: 4.7, experience: "10+ years" },
        { name: "Emergency Plumber 24/7", rating: 4.8, experience: "12+ years" }
      ]
    },
    "carpenter": {
      name: "Carpenter Service", icon: "🪚", providers: 2,
      about: "Skilled carpenters for furniture making, repair, and woodwork.",
      pricing: [
        { service: "Furniture Repair", price: "₹400-1000" },
        { service: "Custom Furniture Making", price: "₹2000-10000" },
        { service: "Door/ Window Repair", price: "₹300-800" },
        { service: "Kitchen Cabinet Installation", price: "₹2000-8000" },
        { service: "Wood Polishing", price: "₹500-1500" }
      ],
      features: ["Experienced Carpenters", "Quality Wood", "Custom Design", "On-time Delivery"],
      responseTime: "2-4 hours",
      warranty: "6 months on workmanship",
      providersList: [
        { name: "Vijay Carpenter", rating: 4.9, experience: "20+ years" },
        { name: "Furniture Works", rating: 4.5, experience: "12+ years" }
      ]
    },
    "cleaner": {
      name: "Cleaning Service", icon: "🧹", providers: 2,
      about: "Professional cleaning services for home and office. Deep cleaning, regular maintenance, and more.",
      pricing: [
        { service: "Home Deep Cleaning", price: "₹1500-4000" },
        { service: "Office Cleaning", price: "₹2000-5000" },
        { service: "Sofa/Carpet Cleaning", price: "₹500-1500" },
        { service: "Bathroom Cleaning", price: "₹300-600" },
        { service: "Kitchen Cleaning", price: "₹400-800" }
      ],
      features: ["Eco-friendly Products", "Trained Staff", "Flexible Timing", "Satisfaction Guaranteed"],
      responseTime: "Same Day",
      warranty: "Service guarantee",
      providersList: [
        { name: "Lakhisarai Cleaners", rating: 4.7, experience: "8+ years" },
        { name: "Deep Cleaning Service", rating: 4.6, experience: "5+ years" }
      ]
    }
  };

  function getQueryParam(param) { return new URLSearchParams(window.location.search).get(param); }

  function loadService() {
    const type = getQueryParam('type');
    if (!type || !servicesDB[type]) { errorPage(); return; }
    
    const service = servicesDB[type];
    
    const pricingHtml = service.pricing.map(p => `
      <div class="price-item">
        <div><span class="price-name">${p.service}</span></div>
        <div><span class="price-amount">${p.price}</span></div>
      </div>
    `).join('');
    
    const featuresHtml = service.features.map(f => `<span class="badge" style="background:var(--bg); margin-right:8px; margin-bottom:8px;">✅ ${f}</span>`).join('');
    
    const providersHtml = service.providersList.map(p => `
      <div class="price-item">
        <div><span class="price-name">${p.name}</span></div>
        <div><span>⭐ ${p.rating} • ${p.experience}</span></div>
        <button class="btn-call" onclick="bookProvider('${type}', '${p.name}')">Book →</button>
      </div>
    `).join('');
    
    const html = `
      <div class="service-card">
        <div class="service-header">
          <div class="service-icon-large">${service.icon}</div>
          <div class="service-info">
            <div class="service-name">${service.name}</div>
            <div class="service-category">Local Service • ${service.providers} providers available</div>
            <div class="service-rating"><span class="stars">★★★★★</span> 4.8 average rating</div>
            <div class="contact-buttons"><a href="tel:+918102284634" class="btn-call"><i class="fas fa-phone-alt"></i> Call Support</a><a href="https://wa.me/918102284634" class="btn-call"><i class="fab fa-whatsapp"></i> WhatsApp</a></div>
          </div>
        </div>
        
        <div class="section"><div class="section-title"><i class="fas fa-info-circle"></i> About</div><p style="color: var(--text-light); line-height: 1.6;">${service.about}</p></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-tag"></i> Pricing</div><div class="price-list">${pricingHtml}</div></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-star"></i> Features</div><div>${featuresHtml}</div></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-clock"></i> Service Information</div><div class="info-grid"><div class="info-item"><div class="info-label">Response Time</div><div class="info-value">${service.responseTime}</div></div><div class="info-item"><div class="info-label">Service Warranty</div><div class="info-value">${service.warranty}</div></div><div class="info-item"><div class="info-label">Availability</div><div class="info-value">24/7</div></div></div></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-users"></i> Our Providers</div><div class="price-list">${providersHtml}</div></div>
        
        <div style="padding: 20px 28px 28px;">
          <button class="btn-book" onclick="bookServiceGeneric('${type}', '${service.name}')">🔧 Book ${service.name} →</button>
        </div>
      </div>
    `;
    
    document.getElementById('serviceContent').innerHTML = html;
  }
  
  function bookProvider(serviceType, providerName) {
    const user = WeConnectAuth.getCurrentUser();
    if (!user) { WeConnect.showToast('Please login to book', 'warning'); setTimeout(() => window.location.href = '/user/login.html', 1000); return; }
    sessionStorage.setItem('booking_temp', JSON.stringify({ type: 'local-service', serviceType: serviceType, providerName: providerName }));
    window.location.href = `/local-services/booking.html?type=${serviceType}&provider=${encodeURIComponent(providerName)}`;
  }
  
  function bookServiceGeneric(type, name) {
    const user = WeConnectAuth.getCurrentUser();
    if (!user) { WeConnect.showToast('Please login to book', 'warning'); setTimeout(() => window.location.href = '/user/login.html', 1000); return; }
    sessionStorage.setItem('booking_temp', JSON.stringify({ type: 'local-service', serviceType: type, name: name }));
    window.location.href = `/local-services/booking.html?type=${type}&name=${encodeURIComponent(name)}`;
  }
  
  function errorPage() { document.getElementById('serviceContent').innerHTML = `<div class="service-card"><div style="text-align:center;padding:60px;"><i class="fas fa-exclamation-triangle" style="font-size:48px;color:var(--rejected);"></i><h3>Service Not Found</h3><a href="/local-services/index.html" class="btn btn-primary">Back to Local Services</a></div></div>`; }
  
  function updateUI() { const u = WeConnectAuth.getCurrentUser(); if (u) { document.getElementById('login-nav-btn').style.display = 'none'; document.getElementById('logout-nav-btn').style.display = 'inline-flex'; document.getElementById('user-name').style.display = 'inline-block'; document.getElementById('user-name').textContent = u.name || u.phone; document.getElementById('my-orders-link').style.display = 'inline-block'; } }
  
  window.logout = function() { sessionStorage.removeItem('weconnect_current_user'); window.location.href = '/index.html'; };
  window.bookProvider = bookProvider;
  window.bookServiceGeneric = bookServiceGeneric;
  updateUI();
  loadService();
</script>
</body>
</html>
