<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Doctor Details | WeConnect Healthcare</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* your existing CSS - unchanged */
    .doctor-detail-container { min-height: 100vh; padding: 100px 20px 60px; background: var(--bg-secondary); }
    .detail-wrapper { max-width: 1000px; margin: 0 auto; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-light); text-decoration: none; margin-bottom: 24px; font-size: 14px; }
    .back-link:hover { color: var(--text); }
    .doctor-card { background: var(--bg); border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .doctor-header { padding: 32px; border-bottom: 1px solid var(--border); display: flex; gap: 24px; flex-wrap: wrap; }
    .doctor-avatar { width: 100px; height: 100px; background: rgba(59,130,246,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .doctor-info { flex: 1; }
    .doctor-name { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .doctor-specialty { font-size: 16px; color: var(--blue); margin-bottom: 8px; }
    .doctor-rating { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .stars { color: #F59E0B; font-size: 14px; }
    .reviews { font-size: 13px; color: var(--text-muted); }
    .contact-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-call { padding: 10px 24px; background: rgba(16,185,129,0.1); color: var(--confirmed); border: 1px solid rgba(16,185,129,0.3); border-radius: var(--radius-md); font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .btn-call:hover { background: var(--confirmed); color: white; }
    .doctor-details-section { padding: 32px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .detail-item { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 14px 16px; }
    .detail-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .detail-value { font-size: 15px; font-weight: 600; }
    .availability-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .availability-day { padding: 6px 12px; background: var(--bg); border-radius: var(--radius-md); font-size: 13px; border: 1px solid var(--border); }
    .fee-box { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 20px; text-align: center; margin-top: 20px; }
    .fee-amount { font-size: 32px; font-weight: 700; color: var(--text); }
    .fee-note { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .booking-section { padding: 32px; }
    .booking-form { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 24px; margin-top: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 14px; }
    .btn-submit { width: 100%; padding: 14px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-submit:hover { background: #333; transform: translateY(-2px); }
    @media (max-width: 768px) { .details-grid { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } .doctor-header { flex-direction: column; text-align: center; } .doctor-rating { justify-content: center; } .contact-buttons { justify-content: center; } }
  </style>
</head>
<body>

<!-- navbar, mobile-menu, footer - same as your original file, unchanged -->
<nav class="navbar">...</nav>
<div class="mobile-menu">...</div>

<div class="doctor-detail-container">
  <div class="detail-wrapper">
    <a href="/healthcare/index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Healthcare</a>
    <div id="doctorContent"></div>
  </div>
</div>

<footer>...</footer>

<script src="/js/app.js"></script>

<script>
  // Complete Doctors Database (your original - unchanged)
  const doctorsDB = {
    1: {
      id: 1, name: "Dr. Rajesh Kumar", specialty: "General Physician",
      qualification: "MBBS, MD (Medicine)", experience: "15+ years",
      hospital: "Sadar Hospital", location: "Station Road", rating: 4.9, reviews: 1245,
      fee: 500, availability: "Mon-Sat, 10 AM - 6 PM", languages: ["Hindi", "English"],
      about: "Dr. Rajesh Kumar is a renowned general physician...",
      education: "MBBS - Patna Medical College, MD - AIIMS Delhi",
      procedures: ["General Checkup", "Fever Treatment", "BP Management", "Diabetes Care", "Thyroid Management", "ECG"]
    },
    2: {
      id: 2, name: "Dr. Priya Sinha", specialty: "Gynecologist",
      qualification: "MBBS, MS (Obstetrics & Gynecology)", experience: "12+ years",
      hospital: "City Care Hospital", location: "Main Bazaar", rating: 4.8, reviews: 982,
      fee: 600, availability: "Mon-Sat, 9 AM - 5 PM", languages: ["Hindi", "English"],
      about: "Specialist in high-risk pregnancy...",
      education: "MBBS - MGM Medical College, MS - KGMU Lucknow",
      procedures: ["Pregnancy Care", "Fertility Treatment", "Menopause Care", "Ultrasound", "Laparoscopic Surgery", "Normal Delivery"]
    },
    3: {
      id: 3, name: "Dr. Suresh Prasad", specialty: "Pediatrician",
      qualification: "MBBS, DCH", experience: "10+ years",
      hospital: "Lakhisarai Nursing Home", location: "Katoria Road", rating: 4.6, reviews: 756,
      fee: 400, availability: "Mon-Fri, 11 AM - 7 PM", languages: ["Hindi", "English"],
      about: "Child specialist focusing on newborn care...",
      education: "MBBS - Nalanda Medical College, DCH - IGIMS Patna",
      procedures: ["Newborn Care", "Vaccination", "Child Development", "Nutrition Advice", "Asthma Care", "Growth Monitoring"]
    },
    4: {
      id: 4, name: "Dr. Anita Verma", specialty: "Dermatologist",
      qualification: "MBBS, MD (Dermatology)", experience: "8+ years",
      hospital: "City Care Hospital", location: "Main Bazaar", rating: 4.9, reviews: 432,
      fee: 700, availability: "Tue-Sat, 2 PM - 8 PM", languages: ["Hindi", "English"],
      about: "Skin specialist offering treatments for acne, psoriasis...",
      education: "MBBS - IGIMS Patna, MD - AIIMS Delhi",
      procedures: ["Acne Treatment", "Hair Fall Solution", "Psoriasis Care", "Eczema Treatment", "Laser Procedures", "Chemical Peel"]
    },
    5: {
      id: 5, name: "Dr. Manoj Singh", specialty: "Cardiologist",
      qualification: "MBBS, DM (Cardiology)", experience: "18+ years",
      hospital: "City Care Hospital", location: "Main Bazaar", rating: 4.9, reviews: 654,
      fee: 1000, availability: "Mon-Sat, 10 AM - 4 PM", languages: ["Hindi", "English"],
      about: "Heart specialist with expertise in ECG, Echo, TMT...",
      education: "MBBS - Rajendra Institute, DM - AIIMS Delhi",
      procedures: ["ECG", "Echo", "TMT", "BP Management", "Cholesterol Care", "Angiography"]
    },
    6: {
      id: 6, name: "Dr. Vikash Thakur", specialty: "Orthopedic",
      qualification: "MBBS, MS (Orthopedics)", experience: "14+ years",
      hospital: "Sadar Hospital", location: "Station Road", rating: 4.7, reviews: 543,
      fee: 600, availability: "Mon-Sat, 11 AM - 5 PM", languages: ["Hindi", "English"],
      about: "Bone and joint specialist...",
      education: "MBBS - PMCH, MS - AIIMS Delhi",
      procedures: ["Fracture Care", "Joint Replacement", "Arthroscopy", "Sports Injury", "Spine Care", "Arthritis Treatment"]
    }
  };

  function getDoctorIdFromUrl() { return new URLSearchParams(window.location.search).get('id'); }

  function loadDoctor() {
    const doctorId = getDoctorIdFromUrl();
    if (!doctorId) { showError('No doctor selected'); return; }
    const doctor = doctorsDB[doctorId];
    if (!doctor) { showError('Doctor not found'); return; }
    
    const starsFull = Math.floor(doctor.rating);
    const starsHalf = doctor.rating % 1 >= 0.5 ? '½' : '';
    const starsDisplay = '★'.repeat(starsFull) + starsHalf;
    const proceduresHtml = doctor.procedures.map(p => `<span class="availability-day">${p}</span>`).join('');
    
    const html = `
      <div class="doctor-card">
        <div class="doctor-header">
          <div class="doctor-avatar">👨‍⚕️</div>
          <div class="doctor-info">
            <div class="doctor-name">${doctor.name}</div>
            <div class="doctor-specialty">${doctor.specialty}</div>
            <div class="doctor-rating"><span class="stars">${starsDisplay}</span><span class="reviews">(${doctor.reviews} reviews)</span></div>
            <div class="contact-buttons"><a href="tel:+918102284634" class="btn-call"><i class="fas fa-phone-alt"></i> Call: +91 81022 84634</a><a href="https://wa.me/918102284634" class="btn-call"><i class="fab fa-whatsapp"></i> WhatsApp</a></div>
          </div>
        </div>
        <div class="doctor-details-section"><div class="section-title"><i class="fas fa-user-md"></i> Professional Details</div>
          <div class="details-grid">
            <div class="detail-item"><div class="detail-label">Qualification</div><div class="detail-value">${doctor.qualification}</div></div>
            <div class="detail-item"><div class="detail-label">Experience</div><div class="detail-value">${doctor.experience}</div></div>
            <div class="detail-item"><div class="detail-label">Education</div><div class="detail-value">${doctor.education}</div></div>
            <div class="detail-item"><div class="detail-label">Associated Hospital</div><div class="detail-value">${doctor.hospital}, ${doctor.location}</div></div>
            <div class="detail-item"><div class="detail-label">Languages</div><div class="detail-value">${doctor.languages.join(', ')}</div></div>
            <div class="detail-item"><div class="detail-label">Availability</div><div class="detail-value">${doctor.availability}</div></div>
          </div>
        </div>
        <div class="doctor-details-section"><div class="section-title"><i class="fas fa-stethoscope"></i> About</div><p style="color: var(--text-light); line-height: 1.6;">${doctor.about}</p></div>
        <div class="doctor-details-section"><div class="section-title"><i class="fas fa-notes-medical"></i> Procedures & Services</div><div class="availability-list">${proceduresHtml}</div></div>
        <div class="fee-box"><div class="fee-amount">₹${doctor.fee}<span style="font-size: 14px;">/consultation</span></div><div class="fee-note">Consultation fee may vary based on services</div></div>
        <div class="booking-section"><div class="section-title"><i class="fas fa-calendar-check"></i> Book Appointment</div>
          <form id="bookingForm" class="booking-form">
            <div class="form-row"><div class="form-group"><label>Your Full Name *</label><input type="text" id="patientName" required></div><div class="form-group"><label>WhatsApp Number *</label><input type="tel" id="patientPhone" required></div></div>
            <div class="form-row"><div class="form-group"><label>Age *</label><input type="number" id="patientAge" required min="1" max="120"></div><div class="form-group"><label>Gender *</label><select id="patientGender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div></div>
            <div class="form-row"><div class="form-group"><label>Preferred Date *</label><input type="date" id="appointmentDate" required></div><div class="form-group"><label>Preferred Time *</label><select id="appointmentTime" required><option value="">Select time</option><option>9:00 AM</option><option>10:00 AM</option><option>11:00 AM</option><option>12:00 PM</option><option>2:00 PM</option><option>3:00 PM</option><option>4:00 PM</option><option>5:00 PM</option><option>6:00 PM</option></select></div></div>
            <div class="form-group"><label>Describe Your Health Issue *</label><textarea id="symptoms" rows="3" required placeholder="Briefly describe your symptoms, duration, and any relevant medical history..."></textarea></div>
            <button type="submit" class="btn-submit">✅ Book Appointment</button>
          </form>
        </div>
      </div>
    `;
    document.getElementById('doctorContent').innerHTML = html;
    
    const today = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById('appointmentDate');
    if (dateInput) dateInput.min = today;
    const user = WeConnectAuth.getCurrentUser();
    if (user) {
      const nameInput = document.getElementById('patientName');
      const phoneInput = document.getElementById('patientPhone');
      if (nameInput) nameInput.value = user.name || '';
      if (phoneInput) phoneInput.value = user.phone || '';
    }
    
    // FIXED: form submission using localStorage (no broken fetch)
    const form = document.getElementById('bookingForm');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const currentUser = WeConnectAuth.getCurrentUser();
        if (!currentUser) {
          WeConnect.showToast('Please login to book appointment', 'warning');
          setTimeout(() => window.location.href = '/user/login.html', 1000);
          return;
        }
        const name = document.getElementById('patientName').value.trim();
        const phone = document.getElementById('patientPhone').value.trim();
        const age = document.getElementById('patientAge').value;
        const gender = document.getElementById('patientGender').value;
        const date = document.getElementById('appointmentDate').value;
        const time = document.getElementById('appointmentTime').value;
        const symptoms = document.getElementById('symptoms').value.trim();
        if (!name || !phone || !age || !date || !time || !symptoms) {
          WeConnect.showToast('Please fill all required fields', 'error');
          return;
        }
        const doctor = doctorsDB[getDoctorIdFromUrl()];
        const bookingId = 'LC-' + Date.now();
        const booking = {
          id: bookingId, userId: currentUser.id, userPhone: currentUser.phone,
          userName: currentUser.name || name, serviceType: "Healthcare",
          serviceName: doctor.name, status: "pending",
          createdAt: new Date().toISOString(),
          formData: { doctor: doctor.name, specialty: doctor.specialty,
                      patientName: name, patientPhone: phone, patientAge: age, patientGender: gender,
                      date: date, time: time, symptoms: symptoms }
        };
        let bookings = JSON.parse(localStorage.getItem('weconnect_bookings') || '[]');
        bookings.push(booking);
        localStorage.setItem('weconnect_bookings', JSON.stringify(bookings));
        WeConnect.showToast(`✅ Booking confirmed! ID: ${bookingId}`, 'success');
        setTimeout(() => window.location.href = `/user/confirmation.html?id=${bookingId}`, 1500);
      });
    }
  }
  
  function showError(message) { /* same as your original */ }
  function updateUI() { /* same as your original */ }
  window.logout = function() { WeConnectAuth.logout(); window.location.href = '/index.html'; };
  updateUI();
  loadDoctor();
</script>
</body>
</html>
