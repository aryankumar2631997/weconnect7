<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Hotel Details | WeConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .detail-container { min-height: 100vh; padding: 100px 20px 60px; background: var(--bg-secondary); }
    .detail-wrapper { max-width: 900px; margin: 0 auto; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-light); text-decoration: none; margin-bottom: 24px; }
    .back-link:hover { color: var(--text); }
    .hotel-card { background: var(--bg); border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--border); }
    .hotel-header { padding: 28px; border-bottom: 1px solid var(--border); display: flex; gap: 24px; flex-wrap: wrap; }
    .hotel-icon { width: 80px; height: 80px; background: var(--bg-secondary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .hotel-info { flex: 1; }
    .hotel-name { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .hotel-location { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .hotel-rating { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .stars { color: #F59E0B; font-size: 14px; }
    .contact-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-call { padding: 8px 20px; background: rgba(16,185,129,0.1); color: var(--confirmed); border: 1px solid rgba(16,185,129,0.3); border-radius: var(--radius-md); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .section { padding: 24px 28px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .rooms-grid { display: flex; flex-direction: column; gap: 16px; }
    .room-item { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .room-name { font-size: 16px; font-weight: 700; }
    .room-price { font-size: 18px; font-weight: 700; color: var(--blue); }
    .room-price small { font-size: 11px; font-weight: normal; color: var(--text-muted); }
    .room-features { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .btn-book-room { padding: 10px 28px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-book-room:hover { background: #333; transform: translateY(-2px); }
    .amenities-list { display: flex; flex-wrap: wrap; gap: 12px; }
    .amenity { padding: 8px 16px; background: var(--bg-secondary); border-radius: 30px; font-size: 13px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .info-item { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 14px; text-align: center; }
    .info-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .info-value { font-size: 18px; font-weight: 700; }
    @media (max-width: 768px) { .rooms-grid { gap: 12px; } .room-item { flex-direction: column; text-align: center; } .info-grid { grid-template-columns: 1fr; } .hotel-header { flex-direction: column; text-align: center; } .contact-buttons { justify-content: center; } }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="logo"><div class="logo-icon">🔗</div><div class="logo-text">We<span>Connect</span></div></a>
    <ul class="nav-links"><li><a href="/index.html">Home</a></li><li><a href="/user/my-orders.html" id="my-orders-link" style="display:none">My Orders</a></li></ul>
    <div class="nav-buttons"><span id="user-name" style="display:none;"></span><button class="btn btn-outline" id="login-nav-btn" onclick="window.location.href='/user/login.html'">Login</button><button class="btn btn-primary" id="logout-nav-btn" style="display:none" onclick="logout()">Logout</button></div>
    <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu"><a href="/index.html">Home</a><a href="/user/my-orders.html" id="mobile-my-orders" style="display:none">My Orders</a><a href="/user/login.html" id="mobile-login">Login</a><a href="#" id="mobile-logout" style="display:none" onclick="logout()">Logout</a></div>

<div class="detail-container">
  <div class="detail-wrapper">
    <a href="/hotel/index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Hotels</a>
    <div id="hotelContent"><div style="text-align:center;padding:60px;"><i class="fas fa-spinner fa-spin"></i> Loading hotel details...</div></div>
  </div>
</div>

<footer><div class="container"><div class="footer-content"><div class="footer-logo">WeConnect</div><div class="footer-text">© 2025 WeConnect — Lakhisarai, Bihar</div></div></div></footer>

<script src="/js/app.js"></script>

<script>
  const hotelsData = {
    1: { name: "Hotel Rajdhani", location: "Station Road, Lakhisarai", rating: 4.2, reviews: 345, rooms: [{ name: "Standard Non-AC", price: 600, features: ["Double Bed", "Attached Bathroom"] }, { name: "Deluxe AC", price: 1200, features: ["AC", "Double Bed", "TV", "Attached Bathroom"] }, { name: "Suite", price: 2500, features: ["AC", "King Bed", "TV", "Mini Fridge", "Sofa"] }], amenities: ["Free WiFi", "Parking", "Restaurant", "Room Service", "Laundry"], timings: { checkin: "12:00 PM", checkout: "11:00 AM" }, about: "Hotel Rajdhani is a premium hotel in the heart of Lakhisarai, offering comfortable rooms and excellent service." },
    2: { name: "Hotel Maharaja", location: "Main Bazaar, Lakhisarai", rating: 4.7, reviews: 892, rooms: [{ name: "Standard AC", price: 800, features: ["AC", "Double Bed", "TV"] }, { name: "Deluxe AC", price: 1500, features: ["AC", "King Bed", "TV", "Mini Fridge"] }, { name: "Premium Suite", price: 3000, features: ["AC", "King Bed", "TV", "Mini Fridge", "Sofa", "Bathtub"] }], amenities: ["Free WiFi", "Parking", "Restaurant", "Bar", "Gym", "Spa"], timings: { checkin: "11:00 AM", checkout: "10:00 AM" }, about: "Hotel Maharaja is a luxury hotel offering world-class amenities and exceptional hospitality." },
    3: { name: "Hotel City Palace", location: "Katoria Road, Lakhisarai", rating: 4.0, reviews: 234, rooms: [{ name: "Standard Non-AC", price: 500, features: ["Double Bed"] }, { name: "Standard AC", price: 1000, features: ["AC", "Double Bed", "TV"] }, { name: "Family Suite", price: 2000, features: ["AC", "2 Double Beds", "TV", "Attached Bathroom"] }], amenities: ["Free WiFi", "Parking", "Restaurant", "Family Rooms"], timings: { checkin: "1:00 PM", checkout: "12:00 PM" }, about: "Hotel City Palace is a budget-friendly hotel perfect for families and business travelers." }
  };

  function getQueryParam(param) { return new URLSearchParams(window.location.search).get(param); }

  function loadHotel() {
    const id = getQueryParam('id');
    if (!id || !hotelsData[id]) { errorPage(); return; }
    
    const hotel = hotelsData[id];
    const starsFull = Math.floor(hotel.rating);
    const starsHalf = hotel.rating % 1 >= 0.5 ? '½' : '';
    
    let roomsHtml = hotel.rooms.map(room => `
      <div class="room-item">
        <div>
          <div class="room-name">🛏️ ${room.name}</div>
          <div class="room-features">${room.features.join(' • ')}</div>
        </div>
        <div>
          <div class="room-price">₹${room.price}<small>/night</small></div>
        </div>
        <button class="btn-book-room" onclick="bookRoom(${id}, '${room.name}', ${room.price})">Book Now →</button>
      </div>
    `).join('');
    
    const amenitiesHtml = hotel.amenities.map(a => `<span class="amenity">✅ ${a}</span>`).join('');
    
    const html = `
      <div class="hotel-card">
        <div class="hotel-header">
          <div class="hotel-icon">🏨</div>
          <div class="hotel-info">
            <div class="hotel-name">${hotel.name}</div>
            <div class="hotel-location"><i class="fas fa-map-marker-alt"></i> ${hotel.location}</div>
            <div class="hotel-rating"><span class="stars">${'★'.repeat(starsFull)}${starsHalf}</span> ${hotel.rating} (${hotel.reviews} reviews)</div>
            <div class="contact-buttons"><a href="tel:+918102284634" class="btn-call"><i class="fas fa-phone-alt"></i> Call Hotel</a><a href="https://wa.me/918102284634" class="btn-call"><i class="fab fa-whatsapp"></i> WhatsApp</a></div>
          </div>
        </div>
        
        <div class="section"><div class="section-title"><i class="fas fa-info-circle"></i> About</div><p style="color: var(--text-light);">${hotel.about}</p></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-bed"></i> Rooms & Tariffs</div><div class="rooms-grid">${roomsHtml}</div></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-clock"></i> Check-in / Check-out</div><div class="info-grid"><div class="info-item"><div class="info-label">Check-in Time</div><div class="info-value">${hotel.timings.checkin}</div></div><div class="info-item"><div class="info-label">Check-out Time</div><div class="info-value">${hotel.timings.checkout}</div></div></div></div>
        
        <div class="section"><div class="section-title"><i class="fas fa-concierge-bell"></i> Amenities</div><div class="amenities-list">${amenitiesHtml}</div></div>
      </div>
    `;
    
    document.getElementById('hotelContent').innerHTML = html;
  }
  
  function bookRoom(hotelId, roomName, price) {
    const user = WeConnectAuth.getCurrentUser();
    if (!user) { WeConnect.showToast('Please login to book', 'warning'); setTimeout(() => window.location.href = '/user/login.html', 1000); return; }
    const hotel = hotelsData[hotelId];
    sessionStorage.setItem('booking_temp', JSON.stringify({ type: 'hotel', serviceType: 'hotel', id: hotelId, name: hotel.name, roomName: roomName, price: price }));
    window.location.href = `/hotel/booking.html?type=hotel&id=${hotelId}&room=${encodeURIComponent(roomName)}&price=${price}`;
  }
  
  function errorPage() { document.getElementById('hotelContent').innerHTML = `<div class="hotel-card"><div style="text-align:center;padding:60px;"><i class="fas fa-exclamation-triangle" style="font-size:48px;color:var(--rejected);"></i><h3>Hotel Not Found</h3><a href="/hotel/index.html" class="btn btn-primary">Back to Hotels</a></div></div>`; }
  
  function updateUI() { const u = WeConnectAuth.getCurrentUser(); if (u) { document.getElementById('login-nav-btn').style.display = 'none'; document.getElementById('logout-nav-btn').style.display = 'inline-flex'; document.getElementById('user-name').style.display = 'inline-block'; document.getElementById('user-name').textContent = u.name || u.phone; document.getElementById('my-orders-link').style.display = 'inline-block'; } }
  
  window.logout = function() { sessionStorage.removeItem('weconnect_current_user'); window.location.href = '/index.html'; };
  window.bookRoom = bookRoom;
  updateUI();
  loadHotel();
</script>
</body>
</html>
