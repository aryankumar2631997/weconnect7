<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>My Profile | WeConnect - Lakhisarai's Super App</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .profile-container {
      min-height: 100vh;
      padding: 100px 20px 60px;
      background: var(--bg-secondary);
    }
    .profile-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .profile-sidebar {
      background: var(--bg);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      position: sticky;
      top: 100px;
      height: fit-content;
    }
    .profile-avatar {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }
    .avatar-img {
      width: 100px;
      height: 100px;
      background: var(--text);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 40px;
      color: white;
    }
    .avatar-img i {
      font-size: 50px;
    }
    .profile-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .profile-email {
      font-size: 13px;
      color: var(--text-muted);
    }
    .profile-menu {
      padding: 10px 0;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      color: var(--text-light);
      text-decoration: none;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    .menu-item i {
      width: 20px;
      font-size: 16px;
    }
    .menu-item:hover {
      background: var(--bg-secondary);
      color: var(--text);
    }
    .menu-item.active {
      background: var(--bg-secondary);
      color: var(--text);
      border-left-color: var(--text);
      font-weight: 500;
    }
    .profile-main {
      background: var(--bg);
      border-radius: var(--radius-xl);
      padding: 30px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .profile-header h2 {
      font-size: 24px;
      margin-bottom: 0;
    }
    .edit-btn {
      padding: 8px 20px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .edit-btn:hover {
      background: #333;
      transform: translateY(-2px);
    }
    .info-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
    }
    .info-row {
      display: flex;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      width: 140px;
      font-weight: 600;
      color: var(--text);
    }
    .info-value {
      flex: 1;
      color: var(--text-light);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .stat-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 20px;
      text-align: center;
    }
    .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
    }
    .logout-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--rejected);
      padding: 10px 24px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .logout-btn:hover {
      background: rgba(239,68,68,0.1);
      border-color: var(--rejected);
    }
    .loading-state {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }
    @media (max-width: 768px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }
      .profile-sidebar {
        position: static;
      }
      .info-row {
        flex-direction: column;
      }
      .info-label {
        width: 100%;
        margin-bottom: 5px;
      }
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .profile-header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="logo">
      <div class="logo-icon">🔗</div>
      <div class="logo-text">We<span>Connect</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/index.html#services">Services</a></li>
      <li><a href="/user/my-orders.html" id="my-orders-link" style="display:none">My Orders</a></li>
    </ul>
    <div class="nav-buttons">
      <span id="user-name" style="display:none; margin-right: 16px; font-weight: 500;"></span>
      <button class="btn btn-outline" id="login-nav-btn" onclick="window.location.href='/user/login.html'">Login</button>
      <button class="btn btn-primary" id="logout-nav-btn" style="display:none" onclick="logout()">Logout</button>
    </div>
    <button class="mobile-menu-btn" id="mobileMenuBtn">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="/index.html">Home</a>
  <a href="/user/my-orders.html" id="mobile-my-orders" style="display:none">My Orders</a>
  <a href="/user/login.html" id="mobile-login">Login</a>
  <a href="#" id="mobile-logout" style="display:none" onclick="logout()">Logout</a>
</div>

<div class="profile-container">
  <div class="profile-grid" id="profileContent">
    <div class="loading-state">
      <i class="fas fa-spinner fa-spin" style="font-size: 40px;"></i>
      <p>Loading profile...</p>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <div class="footer-content">
      <div class="footer-logo">WeConnect</div>
      <div class="footer-text">© 2025 WeConnect — Lakhisarai, Bihar</div>
    </div>
  </div>
</footer>

<script src="/js/app.js"></script>

<script>
  // Check authentication
  function checkAuthAndLoad() {
    // Try to get user from sessionStorage
    let user = null;
    const sessionData = sessionStorage.getItem('weconnect_current_user');
    
    if (sessionData) {
      try {
        user = JSON.parse(sessionData);
      } catch(e) {
        console.error('Session parse error:', e);
      }
    }
    
    // Also check localStorage users
    let fullUser = null;
    const usersData = localStorage.getItem('weconnect_users');
    if (usersData && user) {
      try {
        const users = JSON.parse(usersData);
        fullUser = users.find(u => u.id === user.id) || user;
      } catch(e) {
        fullUser = user;
      }
    } else if (user) {
      fullUser = user;
    }
    
    if (!user || !fullUser) {
      // Not logged in, redirect to login
      sessionStorage.setItem('weconnect_redirect_after_login', window.location.pathname);
      window.location.href = '/user/login.html';
      return;
    }
    
    // Render profile
    renderProfile(user, fullUser);
    
    // Update UI for logged in state
    document.getElementById('login-nav-btn').style.display = 'none';
    document.getElementById('logout-nav-btn').style.display = 'inline-flex';
    document.getElementById('user-name').style.display = 'inline-block';
    document.getElementById('user-name').textContent = fullUser.name || fullUser.phone || 'User';
    document.getElementById('my-orders-link').style.display = 'inline-block';
    document.getElementById('mobile-my-orders').style.display = 'block';
    document.getElementById('mobile-login').style.display = 'none';
    document.getElementById('mobile-logout').style.display = 'block';
  }
  
  function renderProfile(sessionUser, fullUser) {
    const name = fullUser.name || sessionUser.name || sessionUser.phone || 'User';
    const email = fullUser.email || sessionUser.email || 'Not provided';
    const phone = sessionUser.phone || fullUser.phone || 'Not provided';
    const city = fullUser.city || 'Lakhisarai';
    const memberSince = fullUser.createdAt ? new Date(fullUser.createdAt).toLocaleDateString('en-IN') : 'Recently';
    
    // Get order stats from bookings
    let totalOrders = 0;
    let pendingOrders = 0;
    let completedOrders = 0;
    
    try {
      const bookingsData = localStorage.getItem('weconnect_bookings');
      if (bookingsData) {
        const bookings = JSON.parse(bookingsData);
        const userBookings = bookings.filter(b => b.userId === sessionUser.id || b.userPhone === sessionUser.phone);
        totalOrders = userBookings.length;
        pendingOrders = userBookings.filter(b => b.status === 'pending').length;
        completedOrders = userBookings.filter(b => b.status === 'completed').length;
      }
    } catch(e) {
      console.error('Error loading bookings:', e);
    }
    
    const html = `
      <div class="profile-sidebar">
        <div class="profile-avatar">
          <div class="avatar-img">
            <i class="fas fa-user-circle"></i>
          </div>
          <div class="profile-name">${escapeHtml(name)}</div>
          <div class="profile-email">${escapeHtml(email)}</div>
        </div>
        <div class="profile-menu">
          <a href="/user/profile.html" class="menu-item active">
            <i class="fas fa-user"></i> My Profile
          </a>
          <a href="/user/profile-edit.html" class="menu-item">
            <i class="fas fa-edit"></i> Edit Profile
          </a>
          <a href="/user/my-orders.html" class="menu-item">
            <i class="fas fa-shopping-bag"></i> My Orders
          </a>
          <a href="#" class="menu-item" onclick="changePassword()">
            <i class="fas fa-key"></i> Change Password
          </a>
        </div>
      </div>
      <div class="profile-main">
        <div class="profile-header">
          <h2>Profile Information</h2>
          <a href="/user/profile-edit.html" class="edit-btn">
            <i class="fas fa-edit"></i> Edit Profile
          </a>
        </div>
        <div class="info-card">
          <div class="info-row">
            <div class="info-label">Full Name</div>
            <div class="info-value">${escapeHtml(name)}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Phone Number</div>
            <div class="info-value">${escapeHtml(phone)}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Email Address</div>
            <div class="info-value">${escapeHtml(email)}</div>
          </div>
          <div class="info-row">
            <div class="info-label">City</div>
            <div class="info-value">${escapeHtml(city)}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Member Since</div>
            <div class="info-value">${escapeHtml(memberSince)}</div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-number">${totalOrders}</div>
            <div class="stat-label">Total Orders</div>
          </div>
          <div class="stat-card">
            <div class="stat-number">${pendingOrders}</div>
            <div class="stat-label">Pending Orders</div>
          </div>
          <div class="stat-card">
            <div class="stat-number">${completedOrders}</div>
            <div class="stat-label">Completed Orders</div>
          </div>
        </div>
        <div class="logout-section">
          <button class="logout-btn" onclick="confirmLogout()">
            <i class="fas fa-sign-out-alt"></i> Logout from Account
          </button>
        </div>
      </div>
    `;
    
    document.getElementById('profileContent').innerHTML = html;
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  function confirmLogout() {
    if (confirm('Are you sure you want to logout?')) {
      sessionStorage.removeItem('weconnect_current_user');
      WeConnect.showToast('Logged out successfully', 'success');
      setTimeout(() => {
        window.location.href = '/index.html';
      }, 1000);
    }
  }
  
  function changePassword() {
    const newPassword = prompt('Enter new password (min 6 characters):');
    if (newPassword && newPassword.length >= 6) {
      const usersData = localStorage.getItem('weconnect_users');
      if (usersData) {
        const users = JSON.parse(usersData);
        const sessionData = sessionStorage.getItem('weconnect_current_user');
        if (sessionData) {
          const sessionUser = JSON.parse(sessionData);
          const index = users.findIndex(u => u.id === sessionUser.id);
          if (index !== -1) {
            users[index].password = newPassword;
            localStorage.setItem('weconnect_users', JSON.stringify(users));
            WeConnect.showToast('Password changed successfully!', 'success');
          } else {
            WeConnect.showToast('User not found', 'error');
          }
        }
      }
    } else if (newPassword) {
      WeConnect.showToast('Password must be at least 6 characters', 'error');
    }
  }
  
  window.logout = function() {
    sessionStorage.removeItem('weconnect_current_user');
    window.location.href = '/index.html';
  };
  
  // Initialize
  checkAuthAndLoad();
</script>
</body>
</html>
