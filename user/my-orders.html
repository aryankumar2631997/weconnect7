<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>My Orders | WeConnect - Lakhisarai's Super App</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .orders-container {
      min-height: 100vh;
      padding: 100px 20px 60px;
      background: var(--bg-secondary);
    }
    .orders-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }
    .orders-header {
      margin-bottom: 30px;
    }
    .orders-header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .orders-header p {
      color: var(--text-light);
      font-size: 14px;
    }
    /* Filters */
    .order-filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-light);
    }
    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .filter-btn:hover:not(.active) {
      border-color: var(--text);
      color: var(--text);
    }
    /* Order Card */
    .order-card {
      background: var(--bg);
      border-radius: var(--radius-xl);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .order-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .order-id {
      font-family: monospace;
      font-weight: 700;
      font-size: 14px;
      background: var(--bg-secondary);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .order-date {
      font-size: 12px;
      color: var(--text-muted);
    }
    .order-service {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .order-icon {
      width: 48px;
      height: 48px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .order-info {
      flex: 1;
    }
    .order-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .order-subtitle {
      font-size: 13px;
      color: var(--text-light);
    }
    .order-details {
      margin-bottom: 16px;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
    }
    .detail-label {
      color: var(--text-muted);
    }
    .detail-value {
      font-weight: 500;
      color: var(--text);
    }
    .order-status {
      margin: 16px 0;
    }
    .status-message-card {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
    }
    .status-pending {
      background: rgba(245,158,11,0.1);
      color: var(--pending);
      border-left: 3px solid var(--pending);
    }
    .status-confirmed {
      background: rgba(16,185,129,0.1);
      color: var(--confirmed);
      border-left: 3px solid var(--confirmed);
    }
    .status-completed {
      background: rgba(59,130,246,0.1);
      color: var(--completed);
      border-left: 3px solid var(--completed);
    }
    .status-rejected {
      background: rgba(239,68,68,0.1);
      color: var(--rejected);
      border-left: 3px solid var(--rejected);
    }
    .order-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .btn-view {
      padding: 8px 20px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-view:hover {
      background: #333;
      transform: translateY(-2px);
    }
    .btn-cancel {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--rejected);
    }
    .btn-cancel:hover {
      background: rgba(239,68,68,0.1);
      border-color: var(--rejected);
    }
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg);
      border-radius: var(--radius-xl);
    }
    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.5;
    }
    .empty-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .empty-desc {
      color: var(--text-light);
      margin-bottom: 24px;
    }
    .browse-btn {
      padding: 12px 28px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    /* Loading */
    .loading-state {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }
    @media (max-width: 768px) {
      .orders-container {
        padding: 90px 16px 40px;
      }
      .order-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .detail-row {
        flex-direction: column;
      }
      .detail-label {
        margin-bottom: 4px;
      }
      .order-actions {
        flex-direction: column;
      }
      .btn-view, .btn-cancel {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="logo">
      <div class="logo-icon">🔗</div>
      <div class="logo-text">We<span>Connect</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/index.html#services">Services</a></li>
      <li><a href="/user/my-orders.html" id="my-orders-link" style="display:none">My Orders</a></li>
    </ul>
    <div class="nav-buttons">
      <span id="user-name" style="display:none; margin-right: 16px; font-weight: 500;"></span>
      <button class="btn btn-outline" id="login-nav-btn" onclick="window.location.href='/user/login.html'">Login</button>
      <button class="btn btn-primary" id="logout-nav-btn" style="display:none" onclick="logout()">Logout</button>
    </div>
    <button class="mobile-menu-btn" id="mobileMenuBtn">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="/index.html">Home</a>
  <a href="/user/my-orders.html" id="mobile-my-orders" style="display:none">My Orders</a>
  <a href="/user/login.html" id="mobile-login">Login</a>
  <a href="#" id="mobile-logout" style="display:none" onclick="logout()">Logout</a>
</div>

<div class="orders-container">
  <div class="orders-wrapper">
    <div class="orders-header">
      <h1>My Orders</h1>
      <p>Track all your bookings and orders in one place</p>
    </div>

    <div class="order-filters" id="orderFilters">
      <button class="filter-btn active" data-filter="all">All Orders</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="confirmed">Confirmed</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
      <button class="filter-btn" data-filter="rejected">Rejected</button>
    </div>

    <div id="ordersList">
      <div class="loading-state">
        <i class="fas fa-spinner fa-spin" style="font-size: 40px;"></i>
        <p>Loading your orders...</p>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <div class="footer-content">
      <div class="footer-logo">WeConnect</div>
      <div class="footer-text">© 2025 WeConnect — Lakhisarai, Bihar</div>
    </div>
  </div>
</footer>

<script src="/js/app.js"></script>

<script>
  let currentFilter = 'all';
  let allOrders = [];

  // Check authentication and load orders
  function checkAuthAndLoad() {
    const sessionData = sessionStorage.getItem('weconnect_current_user');
    if (!sessionData) {
      sessionStorage.setItem('weconnect_redirect_after_login', window.location.pathname);
      window.location.href = '/user/login.html';
      return;
    }
    
    try {
      const user = JSON.parse(sessionData);
      loadUserOrders(user);
      updateAuthUI(user);
    } catch(e) {
      window.location.href = '/user/login.html';
    }
  }

  function updateAuthUI(user) {
    document.getElementById('login-nav-btn').style.display = 'none';
    document.getElementById('logout-nav-btn').style.display = 'inline-flex';
    document.getElementById('user-name').style.display = 'inline-block';
    document.getElementById('user-name').textContent = user.name || user.phone || 'User';
    document.getElementById('my-orders-link').style.display = 'inline-block';
    document.getElementById('mobile-my-orders').style.display = 'block';
    document.getElementById('mobile-login').style.display = 'none';
    document.getElementById('mobile-logout').style.display = 'block';
  }

  function loadUserOrders(user) {
    const bookingsData = localStorage.getItem('weconnect_bookings');
    if (!bookingsData) {
      allOrders = [];
      renderOrders();
      return;
    }
    
    try {
      const allBookings = JSON.parse(bookingsData);
      allOrders = allBookings.filter(b => b.userId === user.id || b.userPhone === user.phone);
      allOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      renderOrders();
    } catch(e) {
      allOrders = [];
      renderOrders();
    }
  }

  function getStatusClass(status) {
    const classes = {
      pending: 'status-pending',
      confirmed: 'status-confirmed',
      completed: 'status-completed',
      rejected: 'status-rejected'
    };
    return classes[status] || 'status-pending';
  }

  function getStatusMessage(status) {
    const messages = {
      pending: '⏳ Your order is placed. Waiting for merchant to confirm...',
      confirmed: '✅ Your order has been confirmed by the merchant!',
      completed: '🎉 Order Completed! Thank you for using WeConnect.',
      rejected: '❌ Order could not be confirmed. Please try another option.'
    };
    return messages[status] || messages.pending;
  }

  function getServiceIcon(serviceType) {
    const icons = {
      'Healthcare': '🏥',
      'Cinema': '🎬',
      'Hotel': '🏨',
      'Transport': '🚗',
      'Wedding': '💍',
      'Local Services': '🔧',
      'School': '📚',
      'Delivery': '📦'
    };
    return icons[serviceType] || '📋';
  }

  function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('en-IN', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    });
  }

  function formatDateTime(dateString) {
    const date = new Date(dateString);
    return date.toLocaleString('en-IN', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function renderOrders() {
    const container = document.getElementById('ordersList');
    let filteredOrders = allOrders;
    
    if (currentFilter !== 'all') {
      filteredOrders = allOrders.filter(o => o.status === currentFilter);
    }
    
    if (filteredOrders.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📦</div>
          <div class="empty-title">No orders found</div>
          <div class="empty-desc">${currentFilter === 'all' ? 'You haven\'t placed any orders yet.' : `No ${currentFilter} orders found.`}</div>
          <a href="/index.html#services" class="browse-btn">Browse Services →</a>
        </div>
      `;
      return;
    }
    
    container.innerHTML = filteredOrders.map(order => `
      <div class="order-card">
        <div class="order-header">
          <div>
            <span class="order-id">#${order.id}</span>
            <span class="order-date">${formatDate(order.createdAt)}</span>
          </div>
          <span class="badge badge-${order.status}">${order.status.toUpperCase()}</span>
        </div>
        
        <div class="order-service">
          <div class="order-icon">${getServiceIcon(order.serviceType)}</div>
          <div class="order-info">
            <div class="order-title">${order.serviceName || order.serviceType}</div>
            <div class="order-subtitle">${order.serviceType}</div>
          </div>
        </div>
        
        <div class="order-details">
          <div class="detail-row">
            <span class="detail-label">Booking Date & Time</span>
            <span class="detail-value">${formatDateTime(order.createdAt)}</span>
          </div>
          ${order.formData?.date ? `<div class="detail-row">
            <span class="detail-label">Service Date</span>
            <span class="detail-value">${order.formData.date}</span>
          </div>` : ''}
          ${order.formData?.time ? `<div class="detail-row">
            <span class="detail-label">Service Time</span>
            <span class="detail-value">${order.formData.time}</span>
          </div>` : ''}
        </div>
        
        <div class="order-status">
          <div class="status-message-card ${getStatusClass(order.status)}">
            ${getStatusMessage(order.status)}
          </div>
        </div>
        
        <div class="order-actions">
          <button class="btn-view" onclick="viewOrderDetails('${order.id}')">View Details →</button>
          ${order.status === 'pending' ? `<button class="btn-cancel" onclick="cancelOrder('${order.id}')">Cancel Order</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  function viewOrderDetails(orderId) {
    window.location.href = `/user/order-details.html?id=${orderId}`;
  }

  function cancelOrder(orderId) {
    if (confirm('Are you sure you want to cancel this order?')) {
      const bookingsData = localStorage.getItem('weconnect_bookings');
      if (bookingsData) {
        const bookings = JSON.parse(bookingsData);
        const index = bookings.findIndex(b => b.id === orderId);
        if (index !== -1 && bookings[index].status === 'pending') {
          bookings[index].status = 'rejected';
          bookings[index].updatedAt = new Date().toISOString();
          if (!bookings[index].statusHistory) bookings[index].statusHistory = [];
          bookings[index].statusHistory.push({
            status: 'rejected',
            timestamp: new Date().toISOString(),
            note: 'Cancelled by user'
          });
          localStorage.setItem('weconnect_bookings', JSON.stringify(bookings));
          
          // Reload orders
          const sessionData = sessionStorage.getItem('weconnect_current_user');
          if (sessionData) {
            const user = JSON.parse(sessionData);
            loadUserOrders(user);
          }
          WeConnect.showToast('Order cancelled successfully', 'success');
        }
      }
    }
  }

  window.viewOrderDetails = viewOrderDetails;
  window.cancelOrder = cancelOrder;

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderOrders();
    });
  });

  window.logout = function() {
    sessionStorage.removeItem('weconnect_current_user');
    window.location.href = '/index.html';
  };

  // Initialize
  checkAuthAndLoad();
</script>
</body>
</html>
